name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dumpring_app/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache iOS Artifacts
        working-directory: dumpring_app
        run: flutter precache --ios

      - name: Install Flutter Dependencies
        working-directory: dumpring_app
        run: flutter pub get

      - name: Build iOS App (No Code Sign)
        working-directory: dumpring_app
        run: |
          flutter build ios --release --no-codesign

      - name: Package Runner.app into .ipa
        working-directory: dumpring_app
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -9 dumpring_app.ipa Payload
          echo "IPA packaging completed successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dumpring_app_ipa
          path: dumpring_app/build/ios/ipa/dumpring_app.ipa
          retention-days: 14

      - name: Build Summary
        run: |
          echo "### 🚀 iOS IPA 빌드 완료!" >> $GITHUB_STEP_SUMMARY
          echo "1. 상단 **Artifacts** 영역에서 \`dumpring_app_ipa\`를 다운로드하세요." >> $GITHUB_STEP_SUMMARY
          echo "2. 다운로드받은 압축을 풀면 \`dumpring_app.ipa\` 파일이 나옵니다." >> $GITHUB_STEP_SUMMARY
          echo "3. 윈도우 PC에서 **Sideloadly**를 켜고 아이폰을 USB로 연결한 뒤, 해당 IPA를 넣어 설치하세요!" >> $GITHUB_STEP_SUMMARY
